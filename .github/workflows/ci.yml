name: Rust CLI qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record runner identity
        run: |
          rustc --version
          cargo --version
          uname -m
      - name: Validate pinned source
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Verify READY, WARN and HOLD
        run: |
          ./target/release/runner-preflight inspect --input ../fixtures/ready-x64.json --format json | grep -q '"status":"READY"'
          set +e
          ./target/release/runner-preflight inspect --input ../fixtures/warn-disk.json --format json > /tmp/runner-warn.json
          warned=$?
          ./target/release/runner-preflight inspect --input ../fixtures/hold-arch.json --format json > /tmp/runner-hold.json
          holding=$?
          set -e
          test "$warned" -eq 1
          test "$holding" -eq 2
          grep -q '"status":"WARN"' /tmp/runner-warn.json
          grep -q '"status":"HOLD"' /tmp/runner-hold.json
      - name: Test GitHub Actions annotations and retain precise exit codes
        run: |
          set -euo pipefail
          ./target/release/runner-preflight inspect --input ../fixtures/ready-x64.json --format github > /tmp/preflight-gh-ready.txt
          grep -Fxq '::notice title=Runner Preflight::READY - Declared requirements match; no host attestation.' /tmp/preflight-gh-ready.txt
          set +e
          ./target/release/runner-preflight inspect --input ../fixtures/warn-disk.json --format github > /tmp/preflight-gh-warn.txt
          warned=$?
          ./target/release/runner-preflight inspect --input ../fixtures/hold-arch.json --format github > /tmp/preflight-gh-hold.txt
          held=$?
          set -e
          test "$warned" -eq 1
          test "$held" -eq 2
          grep -Fq '::warning title=Runner Preflight::DISK_HEADROOM_LOW - ' /tmp/preflight-gh-warn.txt
          grep -Fq '::error title=Runner Preflight::ARCH_MISMATCH - ' /tmp/preflight-gh-hold.txt
          test "$(wc -l < /tmp/preflight-gh-ready.txt)" -eq 1
          # Keep synthetic HOLD annotations out of live CI stdout; inspect files.
      - name: Verify offline GitHub Actions job-stage triage
        run: |
          set -euo pipefail
          set +e
          ./target/release/runner-preflight actions-job --input ../fixtures/actions-job-prestep.json --format json > /tmp/job-prestep.json
          unassigned=$?
          ./target/release/runner-preflight actions-job --input ../fixtures/actions-job-step-failure.json --format json > /tmp/job-failure.json
          executed=$?
          set -e
          test "$unassigned" -eq 2
          test "$executed" -eq 2
          python3 - <<'PY'
          import json
          for path, code, count, recorded in (
              ('/tmp/job-prestep.json', 'FAILED_WITHOUT_RECORDED_STEPS', 0, False),
              ('/tmp/job-failure.json', 'FAILED_WITH_RECORDED_STEPS', 1, True),
          ):
              with open(path, encoding='utf-8') as stream:
                  report = json.load(stream)
              assert report['schema'] == 'runner-preflight-actions-job-v1'
              assert report['signal'] == code
              assert report['recorded_steps'] == count
              assert report['runner_id_recorded'] is recorded
              assert report['root_cause_verified'] is False
              assert 'fictional' not in json.dumps(report)
          PY
      - name: Validate read-only Linux observation with the extracted Rust binary
        working-directory: .
        run: |
          python3 -m unittest discover -s tests -p test_runner_preflight_collector.py -v
          case "$(uname -m)" in
            aarch64|arm64) job=fixtures/job-linux-arm64.json ;;
            x86_64|amd64) job=fixtures/job-linux-x64.json ;;
            *) echo 'Unsupported CI architecture' >&2; exit 1 ;;
          esac
          python3 scripts/collect_linux_runner.py --job "$job" --workspace "$GITHUB_WORKSPACE" > /tmp/runner-inventory.json
          ./rust/target/release/runner-preflight inspect --input /tmp/runner-inventory.json --format json | grep -q '"status":"READY"'

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently verify immutable public v0.2.0 import
        run: |
          python3 -m unittest discover -s tests -p test_import_provenance.py -v
          python3 scripts/verify_import_provenance.py
      - name: Check advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: rust/Cargo.toml
          arguments: --all-features
          command: check
